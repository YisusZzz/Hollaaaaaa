<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teamo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            overflow: hidden;
        }

        @keyframes gradient {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            width: 180px;
            height: 270px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
        }

        .card:hover {
            transform: translateY(-8px) scale(1.04);
            box-shadow: 0 30px 70px rgba(0,0,0,0.45);
        }

        .card:active {
            transform: translateY(-8px) scale(1.04) rotateZ(-4deg);
        }

        .icon {
            font-size: 52px;
            animation: bounce 2s infinite;
            margin-bottom: 12px;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50%       { transform: translateY(-8px); }
        }

        .label {
            color: white;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 1.5px;
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
            z-index: 100;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .overlay.active { display: flex; }

        .modal-box {
            background: white;
            border-radius: 24px;
            padding: 50px 40px;
            width: 85%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
            animation: slideUp 0.4s ease;
            position: relative;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .close {
            position: absolute;
            top: 14px;
            right: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s;
        }

        .close:hover { transform: scale(1.1) rotate(90deg); }

        .teamo {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body>

    <div class="card" onclick="document.getElementById('overlay').classList.add('active')">
        <div class="icon">💌</div>
        <div class="label">HOLA</div>
    </div>

    <div class="overlay" id="overlay">
        <div class="modal-box">
            <button class="close" onclick="document.getElementById('overlay').classList.remove('active')">✕</button>
            <div class="teamo">Te amo</div>
        </div>
    </div>

    <script>
        document.getElementById('overlay').addEventListener('click', function(e) {
            if (e.target === this) this.classList.remove('active');
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                document.getElementById('overlay').classList.remove('active');
            }
        });
    </script>
</body>
</html>
